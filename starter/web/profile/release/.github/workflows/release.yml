name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: aktin/aktin-github-scripts/.github/workflows/verify-web.yml@main

  build:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: aktin/aktin-github-scripts/.github/workflows/build-web.yml@main

  publish:
    needs: build
    permissions:
      contents: write
    uses: aktin/aktin-github-scripts/.github/workflows/publish-release.yml@main
