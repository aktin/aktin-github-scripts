version: 2
updates:
  - package-ecosystem: uv
    directory: /
    # profile:release:start
    target-branch: dev
    # profile:release:end
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    # profile:release:start
    target-branch: dev
    # profile:release:end
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
