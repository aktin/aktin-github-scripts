# scan-codeql: static analysis with CodeQL. Findings go to the code scanning
# tab of the calling repository.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  actions: read, contents: read, security-events: write
name: scan-codeql

on:
  workflow_call:
    inputs:
      languages:
        description: 'CodeQL languages, comma separated (for example java-kotlin, javascript-typescript, python, actions)'
        required: true
        type: string
      build-mode:
        description: 'CodeQL build mode (none, autobuild, manual). Empty uses the default of the language'
        default: ''
        required: false
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
      - uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
