# verify-java: full check of a Maven project. Runs verify-common.yml and
# `./mvnw -B verify`. The job verify passes only when both passed. Server side
# counterpart of hooks/lefthook-java.yml. On push to the default branch the
# job dependencies submits the full Maven dependency tree to the dependency
# graph, so Dependabot also alerts on transitive dependencies.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: write, only the job dependencies uses it
# Expects:      the Maven wrapper in the repository root
name: verify-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string
      pr-max-lines:
        description: 'Maximum added plus deleted lines of a pull request'
        default: 400
        required: false
        type: number

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml
    with:
      pr-max-lines: ${{ inputs.pr-max-lines }}

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B verify

  dependencies:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  verify:
    needs: [base, maven]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A job ended with: $result"
              exit 1
            fi
          done
