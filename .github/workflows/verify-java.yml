# verify-java: full check of a Maven project. Runs verify-common.yml and
# `./mvnw -B verify`. The job verify passes only when both passed. Server side
# counterpart of hooks/lefthook-java.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
# Expects:      the Maven wrapper in the repository root
name: verify-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B verify

  verify:
    needs: [base, maven]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A job ended with: $result"
              exit 1
            fi
          done
