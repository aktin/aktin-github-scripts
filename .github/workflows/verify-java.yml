# verify-java: full check of a Maven project. Runs verify-common.yml and
# `./mvnw -B verify`. Server side counterpart of hooks/lefthook-java.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
# Expects:      the Maven wrapper in the repository root
name: verify-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B verify
