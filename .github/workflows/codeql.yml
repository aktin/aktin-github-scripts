# Reusable: static analysis with CodeQL, results go to the code scanning tab
# of the calling repository. The caller needs the permissions actions: read,
# contents: read and security-events: write.
name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: 'CodeQL languages, comma separated (for example java-kotlin, javascript-typescript, python, actions)'
        required: true
        type: string
      build-mode:
        description: 'CodeQL build mode (none, autobuild, manual). Empty uses the default of the language'
        default: ''
        required: false
        type: string

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
      - uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
