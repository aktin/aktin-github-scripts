# Reusable: language independent lint of the whole repository, the server side
# counterpart of hooks/lefthook.yml. Each step is skipped or passes when the
# repository has no file of its kind.
name: verify-base

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Lint Dockerfiles
        if: hashFiles('**/Dockerfile') != ''
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          failure-threshold: error
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12
