# verify-python: full check of a uv project. Runs verify-common.yml, then
# ruff, mypy, pytest and the build. Server side counterpart of
# hooks/lefthook-python.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
# Expects:      uv.lock, and ruff, mypy and pytest configured in pyproject.toml
name: verify-python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
