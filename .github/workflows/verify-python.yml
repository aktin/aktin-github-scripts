# verify-python: full check of a uv project. Runs verify-common.yml, then the
# Python checks of the project: ruff, mypy, pytest and the build. The job
# verify passes only when verify-common and all these steps passed. Server
# side counterpart of hooks/lefthook-python.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
# Expects:      uv.lock, and ruff, mypy and pytest configured in pyproject.toml
name: verify-python

on:
  workflow_call:
    inputs:
      pr-max-lines:
        description: 'Maximum added plus deleted lines of a pull request'
        default: 400
        required: false
        type: number

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml
    with:
      pr-max-lines: ${{ inputs.pr-max-lines }}

  uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build

  verify:
    needs: [base, uv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A job ended with: $result"
              exit 1
            fi
          done
