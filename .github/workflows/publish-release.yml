# publish-release: publishes a GitHub Release with the files of earlier jobs
# of the same run attached. Writes the release notes with git-cliff.
#
# Call it:      on push of a tag v*, after the jobs that produce the files
# Permissions:  contents: write
# Expects:      cliff.toml in the repository root
# Takes:        every artifact of the run whose name starts with release-.
#               All files in them are attached to the release. The job that
#               uploads an artifact attests its files.
name: publish-release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip all
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.notes.outputs.content }}
          files: release-*/*
