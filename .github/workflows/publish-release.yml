# publish-release: publishes a GitHub Release with the files of earlier jobs
# of the same run attached. Writes the release notes with git-cliff.
#
# Call it:      on push of a tag v*, after the jobs that produce the files
# Permissions:  contents: write
# Expects:      cliff.toml in the repository root
# Takes:        every artifact of the run whose name starts with release-.
#               All files in them are attached to the release. The job that
#               uploads an artifact attests its files.
name: publish-release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.content }}
          files: release-*/*
