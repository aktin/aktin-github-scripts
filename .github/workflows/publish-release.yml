# Reusable: publishes a GitHub Release for files built by earlier jobs of the
# same run. Generates release notes with git-cliff (cliff.toml of the calling
# repository), attests the files and attaches them to the release. Call it on
# push of a tag v*. The calling job must grant contents: write,
# id-token: write and attestations: write.
#
# The earlier jobs hand over the files as artifacts. Which ones exist decides
# what happens:
#   release-files   required. Attached with a build provenance attestation.
#   release-sbom    optional, holds sbom.cdx.json. Attached and attested as
#                   the SBOM of the files in release-files.
#   release-extras  optional, also any artifact whose name starts with
#                   release-extras. Attached as they are, without attestation.
name: publish-release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: release-files/*
      - name: Attest SBOM
        if: hashFiles('release-sbom/sbom.cdx.json') != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: release-files/*
          sbom-path: release-sbom/sbom.cdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.content }}
          files: |
            release-files/*
            release-sbom/*
            release-extras*/*
