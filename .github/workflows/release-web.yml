# Reusable: release of a bun project on a version tag. Runs verify-web.yml,
# builds and packs the web bundle with the version taken from the tag,
# generates its SBOM and hands both to publish-release.yml. Call it on push of
# a tag v*. The calling job must grant contents: write, id-token: write and
# attestations: write.
name: release-web

on:
  workflow_call:
    inputs:
      dist-dir:
        description: 'Directory with the built web bundle'
        default: 'apps/web/dist'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-web.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Sync package version to tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build web bundle
        run: bun run build
      - name: Package web bundle
        env:
          DIST_DIR: ${{ inputs.dist-dir }}
        run: tar -czf "${GITHUB_REPOSITORY#*/}-web-${GITHUB_REF_NAME}.tgz" -C "$DIST_DIR" .
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ github.event.repository.name }}-web-${{ github.ref_name }}.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-release.yml
