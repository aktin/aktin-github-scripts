# Reusable: release of a Maven project on a version tag. Runs verify-java.yml,
# builds the artifact with the version taken from the tag, generates release
# notes with git-cliff (cliff.toml of the calling repository), an SBOM and
# build attestations, then publishes a GitHub Release. Call it on push of a
# tag v*. The calling job must grant contents: write, id-token: write and
# attestations: write.
name: release-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string
      artifact-path:
        description: 'Glob of the built jar that is attested and attached to the release'
        default: 'app/target/*.jar'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-java.yml
    with:
      java-version: ${{ inputs.java-version }}
      java-distribution: ${{ inputs.java-distribution }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip all
      - name: Build application jar
        run: ./mvnw -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" package
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ inputs.artifact-path }}
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: ${{ inputs.artifact-path }}
          sbom-path: sbom.cdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.content }}
          files: |
            ${{ inputs.artifact-path }}
            sbom.cdx.json
