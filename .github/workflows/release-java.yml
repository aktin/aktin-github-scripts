# Reusable: release of a Maven project on a version tag. Runs verify-java.yml,
# builds the jar with the version taken from the tag, generates its SBOM and
# hands both to publish-release.yml. Call it on push of a tag v*. The calling
# job must grant contents: write, id-token: write and attestations: write.
name: release-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string
      artifact-path:
        description: 'Glob of the built jar that is attested and attached to the release'
        default: 'app/target/*.jar'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-java.yml
    with:
      java-version: ${{ inputs.java-version }}
      java-distribution: ${{ inputs.java-distribution }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Build application jar
        run: ./mvnw -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" package
      - name: Locate built jar
        id: jar
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: echo "path=$(compgen -G "$ARTIFACT_PATH" | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.jar.outputs.path }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-release.yml
