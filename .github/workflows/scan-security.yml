# scan-security: Trivy scan of the repository and, optionally, of published
# container images. Findings of severity HIGH and CRITICAL go to the code
# scanning tab of the calling repository. The scan reports, it does not fail
# the run on findings.
#
# Call it:      on a schedule
# Permissions:  contents: read, security-events: write
#
# Job source scans the repository: secrets, misconfigurations (Dockerfiles,
# compose and workflow files) and known vulnerabilities in lock files.
# Job images scans one image per entry of the input images and is skipped
# when the list is empty. The images must be public.
name: scan-security

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON array of image references to scan, for example ["ghcr.io/org/app:latest"]'
        default: '[]'
        required: false
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-source.sarif
          exit-code: '0'
      - name: Upload results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

  images:
    if: ${{ inputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
      - name: Upload results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.image }}
