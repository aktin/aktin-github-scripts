# scan: scans the workflows of this repository with its own scan-codeql. The
# local call makes a pull request run the version of scan-codeql it contains.
name: scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: ./.github/workflows/scan-codeql.yml
    with:
      languages: actions
