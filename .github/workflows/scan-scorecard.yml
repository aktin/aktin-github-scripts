# scan-scorecard: OpenSSF Scorecard analysis, published to the public
# Scorecard API and to the code scanning tab of the calling repository.
#
# Call it:      on push to the default branch and on a schedule
# Permissions:  contents: read, security-events: write, id-token: write
name: scan-scorecard

on:
  workflow_call:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: results.sarif
