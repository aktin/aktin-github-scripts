# verify-web: full check of a bun project. Runs verify-common.yml, then format
# check, lint, typecheck, test and build. Server side counterpart of
# hooks/lefthook-web.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
# Expects:      .bun-version and the package.json scripts format:check, lint,
#               typecheck, test and build
name: verify-web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  base:
    uses: ./.github/workflows/verify-common.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
