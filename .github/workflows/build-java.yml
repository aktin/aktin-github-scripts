# build-java: builds the jar of a Maven project with the version taken from
# the tag and generates its SBOM.
#
# Call it:      on push of a tag v*
# Permissions:  contents: read
# Expects:      the Maven wrapper, and a pom.xml that takes its version from
#               the property revision
# Hands over:   artifact release-files (the jar) and artifact release-sbom
#               (sbom.cdx.json), both kept for one day, for publish-release.yml
#               or publish-image.yml
name: build-java

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string
      artifact-path:
        description: 'Glob of the built jar'
        default: 'app/target/*.jar'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Build application jar
        run: ./mvnw -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" package
      - name: Locate built jar
        id: jar
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: echo "path=$(compgen -G "$ARTIFACT_PATH" | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.jar.outputs.path }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
