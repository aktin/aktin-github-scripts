# build-java: builds the jar of a Maven project with the version taken from
# the tag, generates its SBOM and attests build provenance and the SBOM. The
# input attest set to false skips the SBOM and both attestations.
#
# Call it:      on push of a tag v*
# Permissions:  contents: read, id-token: write, attestations: write
# Expects:      the Maven wrapper, and a pom.xml that takes its version from
#               the property revision
# Hands over:   artifact release-java with the jar and sbom-java.cdx.json,
#               kept for one day, for publish-release.yml or build-publish-image.yml
name: build-java

on:
  workflow_call:
    inputs:
      attest:
        description: 'Generate the SBOM and attest build provenance and the SBOM'
        default: true
        required: false
        type: boolean
      java-version:
        description: 'Java version'
        default: '25'
        required: false
        type: string
      java-distribution:
        description: 'Java distribution'
        default: 'temurin'
        required: false
        type: string
      artifact-path:
        description: 'Glob of the built jar'
        default: 'app/target/*.jar'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Build application jar
        run: ./mvnw -B -DskipTests -Drevision="${GITHUB_REF_NAME#v}" package
      - name: Locate built jar
        if: inputs.attest
        id: jar
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: echo "path=$(compgen -G "$ARTIFACT_PATH" | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        if: inputs.attest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.jar.outputs.path }}
          format: cyclonedx-json
          output-file: sbom-java.cdx.json
          upload-artifact: false
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ inputs.artifact-path }}
      - name: Attest SBOM
        if: inputs.attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: ${{ inputs.artifact-path }}
          sbom-path: sbom-java.cdx.json
      - name: Collect release files
        env:
          FILES: ${{ inputs.artifact-path }}
        run: |
          mkdir release
          # shellcheck disable=SC2086
          cp $FILES release/
          if [[ -f sbom-java.cdx.json ]]; then cp sbom-java.cdx.json release/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-java
          path: release/*
          if-no-files-found: error
          retention-days: 1
