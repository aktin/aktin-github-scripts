# Reusable: OpenSSF Scorecard analysis, published to the public Scorecard API
# and to the code scanning tab of the calling repository. Call it on push to
# the default branch and on a schedule. The calling job must grant
# security-events: write, id-token: write and contents: read.
#
# The Scorecard API verifies this file when results are published: no env or
# defaults, no run steps, only the approved actions in the job. Keep it that
# way, otherwise publishing is rejected.
name: scorecard

on:
  workflow_call:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          sarif_file: results.sarif
