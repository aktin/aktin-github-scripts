# verify-common: lints the files every repository has, whatever its language.
# Dockerfiles with hadolint, shell scripts with shellcheck and workflow files
# with actionlint. A step passes when the repository has no file of its kind.
# On a pull request it also fails when added plus deleted lines exceed
# pr-max-lines, unless its title contains [skip-size]. Server side counterpart
# of hooks/lefthook.yml.
#
# Call it:      on pull_request and on push to the default branch
# Permissions:  contents: read
name: verify-common

on:
  workflow_call:
    inputs:
      pr-max-lines:
        description: 'Maximum added plus deleted lines of a pull request'
        default: 400
        required: false
        type: number

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfiles
        if: hashFiles('**/Dockerfile') != ''
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          failure-threshold: error
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  pr-size:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[skip-size]')
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request size
        env:
          ADDED: ${{ github.event.pull_request.additions }}
          DELETED: ${{ github.event.pull_request.deletions }}
          MAX_LINES: ${{ inputs.pr-max-lines }}
        run: |
          total=$((ADDED + DELETED))
          echo "Pull request changes $total lines, limit is $MAX_LINES"
          if (( total > MAX_LINES )); then
            echo "::error::Pull request changes $total lines, limit is $MAX_LINES. Split it into smaller pull requests"
            exit 1
          fi
