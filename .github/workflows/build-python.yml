# build-python: builds the distributions of a uv project with the version
# taken from the tag, generates their SBOM and attests build provenance and
# the SBOM. The input attest set to false skips the SBOM and both
# attestations.
#
# Call it:      on push of a tag v*
# Permissions:  contents: read, id-token: write, attestations: write
# Expects:      uv.lock
# Hands over:   artifact release-python with wheel, sdist and
#               sbom-python.cdx.json, kept for one day, for publish-release.yml
#               or build-publish-image.yml
name: build-python

on:
  workflow_call:
    inputs:
      attest:
        description: 'Generate the SBOM and attest build provenance and the SBOM'
        default: true
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - name: Sync project version to tag
        run: uv version "${GITHUB_REF_NAME#v}"
      - name: Build distributions
        run: uv build
      - name: Generate SBOM
        if: inputs.attest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom-python.cdx.json
          upload-artifact: false
      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Attest SBOM
        if: inputs.attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: dist/*
          sbom-path: sbom-python.cdx.json
      - name: Collect release files
        run: |
          mkdir release
          cp dist/* release/
          if [[ -f sbom-python.cdx.json ]]; then cp sbom-python.cdx.json release/; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: release/*
          if-no-files-found: error
          retention-days: 1
