# build-python: builds the distributions of a uv project with the version
# taken from the tag and generates their SBOM.
#
# Call it:      on push of a tag v*
# Permissions:  contents: read
# Expects:      uv.lock
# Hands over:   artifact release-files (wheel and sdist) and artifact
#               release-sbom (sbom.cdx.json), both kept for one day, for
#               publish-release.yml or publish-image.yml
name: build-python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --frozen
      - name: Sync project version to tag
        run: uv version "${GITHUB_REF_NAME#v}"
      - name: Build distributions
        run: uv build
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
