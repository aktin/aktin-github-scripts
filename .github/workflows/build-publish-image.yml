# build-publish-image: builds container images and publishes them to GHCR.
# The calling repository brings a build script that builds the images
# complete, with all tags and labels. This workflow runs the script and pushes
# the images as they are, then signs each image with cosign, generates its
# SBOM and attests build provenance and the SBOM. The input attest set to
# false skips signature, SBOM and attestations.
#
# Call it:      on push of a tag v*, or on a schedule to rebuild
# Permissions:  contents: read, packages: write, id-token: write,
#               attestations: write
# Expects:      a build script that tags every image with its full name from
#               the input images. The tag is available to it as
#               GITHUB_REF_NAME.
# Hands over:   one artifact release-<image> per image with its SBOM, kept
#               for one day, so publish-release.yml attaches it
#
# Optional inputs:
#   release-files-path    packages files of an earlier job (build-java.yml,
#                         build-web.yml, build-python.yml). The files of every
#                         artifact whose name starts with release- are
#                         downloaded to this path before the build script
#                         runs.
#   upload-release-files  hands files of the build script to the release, for
#                         example a compose file. They get a build provenance
#                         attestation and are uploaded as artifact
#                         release-files after the build.
#   cache-path and        keep downloads of the build script between runs.
#   cache-key-files       The cache is only shared when a run on the default
#                         branch has filled it. A cache written by a tag run
#                         is not visible to other tags.
name: build-publish-image

on:
  workflow_call:
    inputs:
      build-command:
        description: 'Command that builds and tags the images, run from the repository root, for example ./build.sh'
        required: true
        type: string
      images:
        description: 'JSON array of the image names to push, without tag, for example ["ghcr.io/org/app"]'
        required: true
        type: string
      attest:
        description: 'Sign the images, generate their SBOM and attest build provenance and the SBOM'
        default: true
        required: false
        type: boolean
      release-files-path:
        description: 'Path that receives the files of the release- artifacts before the build. Empty skips the download'
        default: ''
        required: false
        type: string
      upload-release-files:
        description: 'Files the build script produced for the release, attested and uploaded as artifact release-files. Empty skips the upload'
        default: ''
        required: false
        type: string
      cache-path:
        description: 'Directory the build script downloads to, kept between runs. Empty disables the cache'
        default: ''
        required: false
        type: string
      cache-key-files:
        description: 'Files whose content decides when the cache is renewed, for example a file with pinned versions'
        default: ''
        required: false
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release-files-path != ''
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ inputs.release-files-path }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache-path != ''
        with:
          path: ${{ inputs.cache-path }}
          key: publish-image-${{ hashFiles(inputs.cache-key-files) }}
      - name: Build images
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Attest build provenance of the release files
        if: inputs.attest && inputs.upload-release-files != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ inputs.upload-release-files }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.upload-release-files != ''
        with:
          name: release-files
          path: ${{ inputs.upload-release-files }}
          if-no-files-found: error
          retention-days: 1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images and collect digests
        id: push
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          pushed='[]'
          for image in $(jq -r '.[]' <<< "$IMAGES"); do
            docker push --all-tags "$image"
            tagged="$(docker images --format '{{.Repository}}:{{.Tag}}' "$image" | head -n 1)"
            digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tagged" | grep "^${image}@" | head -n 1 | cut -d'@' -f2)"
            pushed="$(jq -c --arg image "$image" --arg digest "$digest" '. + [{image: $image, digest: $digest}]' <<< "$pushed")"
          done
          echo "pushed=${pushed}" >> "$GITHUB_OUTPUT"

  attest:
    needs: push
    if: inputs.attest
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.push.outputs.pushed) }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Derive SBOM file name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}@${{ matrix.digest }}
          format: cyclonedx-json
          output-file: ${{ steps.name.outputs.name }}.sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: ${{ steps.name.outputs.name }}.sbom.cdx.json
