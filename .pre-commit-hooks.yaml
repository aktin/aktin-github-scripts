- id: block-data-files
  name: Block data files outside tests/fixtures
  description: Reject staged data files (csv, xlsx, sql, dcm, hl7, ...) outside tests/fixtures/ to keep patient data out of the repository
  entry: hooks/block_data_files.py
  language: script
  types: [file]

- id: check-large-files
  name: Check for large files
  description: Reject staged files larger than 500 KB
  entry: hooks/check_large_files.py
  language: script
  types: [file]

- id: check-commit-size
  name: Check commit size
  description: Reject commits that change more than 200 lines in total (insertions plus deletions), configurable via --max-lines
  entry: hooks/check_commit_size.py
  language: script
  pass_filenames: false
  always_run: true

- id: check-commit-message
  name: Check commit message format
  description: Validate the commit message against the EU System Conventional Commit rules
  entry: hooks/check_commit_message.py
  language: script
  stages: [commit-msg]
