# Shared git hooks, consumed through lefthook `remotes`. Nothing in this
# repository installs them. Add this to the lefthook.yml of a project:
#
#   remotes:
#     - git_url: https://github.com/aktin/aktin-github-scripts
#       ref: main
#       refetch_frequency: 24h
#       configs:
#         - hooks/lefthook.yml
#
# Requires lefthook >= 2.0.5 (script args) and python3, gitleaks and
# actionlint on PATH. A missing tool fails the commit, it is not skipped.
# Override a hook per project in lefthook-local.yml, for example:
#   pre-commit:
#     scripts:
#       "check_commit_size.py":
#         args: "--max-lines=300"
source_dir: hooks

pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose
    actionlint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/workflows/**/*.{yml,yaml}"
      run: actionlint {staged_files}
  scripts:
    "block_data_files.py":
      runner: python3
      args: "{staged_files}"
    "check_large_files.py":
      runner: python3
      args: "{staged_files}"
    "check_commit_size.py":
      runner: python3

commit-msg:
  scripts:
    "check_commit_message.py":
      runner: python3
